autogenerated = 0

# BitBeast theme state
source = ~/.config/bitbeast/current.conf
source = ~/.config/hypr/bitbeast-theme.conf

monitor = ,preferred,auto,1

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# env = XCURSOR_THEME,Adwaita
# env = HYPRCURSOR_THEME,Adwaita

$mod = SUPER
$terminal = kitty
$browser = google-chrome-stable
$menu = rofi -show drun -config ~/.config/rofi/config.rasi
$bitbeast = ~/.local/bin/bitbeast
exec-once = waybar
exec-once = hyprctl plugin load ~/.local/share/hyprland-plugins/Hyprspace.so
exec-once = $bitbeast session-init
exec-once = ~/.local/bin/bitbeast-battery-watcher
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
workspace = 8, persistent:true

input {
    kb_layout = us
    follow_mouse = 1
    natural_scroll = true
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 6
    gaps_out = 12
    layout = dwindle
    allow_tearing = false
}

dwindle {
    preserve_split = true
}

layerrule {
    name = rofi
    blur = true
    ignore_alpha = 0.1
}

layerrule {
    name = waybar
    blur = false
    ignore_alpha = 1
}

layerrule {
    name = bitbeast-osd
    blur = true
    ignore_alpha = 0.2
}

layerrule {
    name = bitbeast-cc
    blur = true
    ignore_alpha = 0.2
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Touchpad Gestures
gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, overview:toggle
gestures {
    # workspace_swipe = true
    # workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = false
}

# Terminal
bind = $mod, Return, exec, $terminal -e bash -c "fastfetch --config ~/.config/fastfetch/config.jsonc; exec $SHELL"
bind = $mod SHIFT, Return, exec, kitty --class="dropdown"

# Execution and Launchers
bind = $mod, r, exec, $menu
bind = $mod, b, exec, $browser
bind = $mod, o, exec, ~/.local/bin/bongocat
bind = $mod, e, exec, dolphin
bind = $mod, h, exec, $bitbeast keybindings
bind = $mod, C, exec, ~/.local/bin/bitbeast-control-center
bind = $mod, g, overview:toggle
bind = $mod SHIFT, g, exec, ~/.local/bin/bitbeast-workspace-picker
bind = $mod SHIFT, E, exec, $terminal -e yazi
bind = $mod, W, exec, $bitbeast pick
bind = $mod SHIFT, W, exec, $bitbeast style cycle
bind = $mod SHIFT, r, exec, $bitbeast gradient

# Waybar Style Picker (nice named styles)
bind = $mod SHIFT, B, exec, $bitbeast pick-style

# Zsh Theme
bind = $mod, T, exec, $bitbeast zsh cycle
bind = $mod SHIFT, T, exec, $bitbeast zsh pick

# Touchpad Sensitivity Selector
bind = $mod SHIFT, P, exec, $bitbeast touchpad


# Auto Theme from Wallpaper
bind = $mod CTRL, T, exec, $bitbeast auto-theme

# Window Management
bind = $mod, q, killactive
bind = $mod SHIFT, q, exec, hyprctl dispatch exit 0
bind = CTRL ALT, Delete, exec, hyprctl dispatch exit 0

bind = $mod, f, fullscreen
bind = $mod, m, exec, $bitbeast battery-saver # Toggle battery saver/performance mode
bind = $mod CTRL, f, fullscreen, 1
bind = $mod, space, togglefloating
bind = $mod ALT, space, exec, hyprctl dispatch workspaceopt allfloat
bind = $mod SHIFT, I, layoutmsg, togglesplit
bind = $mod, P, pseudo

# Desktop/Workspace
bind = CTRL ALT, L, exec, ~/.local/bin/bitbeast lock
bind = $mod CTRL, L, exec, ~/.local/bin/bitbeast lock
bind = $mod SHIFT, N, exec, $bitbeast session-init

# Window focus (vim keys)
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Window focus (arrow keys)
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Move windows (vim keys)
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

# Move windows (arrow keys)
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Hold SUPER and drag an app with mouse to move/resize it
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Resize windows
binde = $mod CTRL, h, resizeactive, -30 0
binde = $mod CTRL, l, resizeactive, 30 0
binde = $mod CTRL, k, resizeactive, 0 -30
binde = $mod CTRL, j, resizeactive, 0 30
binde = $mod CTRL, left, resizeactive, -30 0
binde = $mod CTRL, right, resizeactive, 30 0
binde = $mod CTRL, up, resizeactive, 0 -30
binde = $mod CTRL, down, resizeactive, 0 30

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, Tab, workspace, m+1
bind = $mod SHIFT, Tab, workspace, m-1

# Send active app to a workspace and stay on the current workspace
bind = $mod CTRL, 1, movetoworkspacesilent, 1
bind = $mod CTRL, 2, movetoworkspacesilent, 2
bind = $mod CTRL, 3, movetoworkspacesilent, 3
bind = $mod CTRL, 4, movetoworkspacesilent, 4
bind = $mod CTRL, 5, movetoworkspacesilent, 5
bind = $mod CTRL, 6, movetoworkspacesilent, 6
bind = $mod CTRL, 7, movetoworkspacesilent, 7
bind = $mod CTRL, 8, movetoworkspacesilent, 8

# Send active app to a workspace and follow it
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8

# Special workspace
bind = $mod SHIFT, U, movetoworkspace, special
bind = $mod, U, togglespecialworkspace

# Scroll through existing workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Brightness
binde = , XF86MonBrightnessUp, exec, ~/.local/bin/bitbeast-osd brightness raise
binde = , XF86MonBrightnessDown, exec, ~/.local/bin/bitbeast-osd brightness lower

# Volume
binde = , XF86AudioRaiseVolume, exec, ~/.local/bin/bitbeast-osd volume raise
binde = , XF86AudioLowerVolume, exec, ~/.local/bin/bitbeast-osd volume lower
bind = , XF86AudioMute, exec, ~/.local/bin/bitbeast-osd volume mute
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media Keys
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Screenshot
bind = $mod, s, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +'%Y-%m-%d-%H%M%S').png | wl-copy
bind = $mod SHIFT, s, exec, mkdir -p ~/Pictures/Screenshots && grim - | tee ~/Pictures/Screenshots/$(date +'%Y-%m-%d-%H%M%S').png | wl-copy
bind = $mod, v, exec, $bitbeast clipboard
bind = $mod, A, exec, ~/.local/bin/toggle-transparency

# Visualizer Rules
windowrule = float 1, match:class ^(bitbeast-visualizer)$
windowrule = pin 1, match:class ^(bitbeast-visualizer)$
windowrule = center 1, match:class ^(bitbeast-visualizer)$
windowrule = size 800 350, match:class ^(bitbeast-visualizer)$
windowrule = border_size 0, match:class ^(bitbeast-visualizer)$

# BongoCat Rules
windowrule = float 1, match:class ^(Bongo-cat)$
windowrule = pin 1, match:class ^(Bongo-cat)$
windowrule = center 1, match:class ^(Bongo-cat)$
windowrule = size 420 420, match:class ^(Bongo-cat)$
windowrule = border_size 0, match:class ^(Bongo-cat)$

# Hints Rules
windowrule = float 1, match:class ^(bitbeast-hints)$
windowrule = pin 1, match:class ^(bitbeast-hints)$
windowrule = center 1, match:class ^(bitbeast-hints)$
windowrule = size 1080 720, match:class ^(bitbeast-hints)$
windowrule = border_size 0, match:class ^(bitbeast-hints)$

# Touchpad Configuration
source = ~/.config/hypr/touchpad.conf

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default
    animation = border, 1, 10, default
    animation = borderangle, 1, 30, linear, loop
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}
