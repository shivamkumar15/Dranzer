# cava-spiral — rotating Orion ring audio visualizer
# Run with: cava-spiral   (or: cava -p ~/.config/cava/spiral.conf)
# Shaders: ~/.config/cava/shaders/orion_circle_rotate.frag + pass_through.vert

[general]
bars = 100
bar_width = 1
bar_spacing = 0
framerate = 120
sensitivity = 100
autosens = 1

[input]
method = pulse
source = auto

[output]
method = sdl_glsl
vertex_shader = pass_through.vert
fragment_shader = orion_circle_rotate.frag
channels = mono
mono_option = average
# keep spinning even when audio is silent
continuous_rendering = 1
# centered square window
sdl_width = 900
sdl_height = 900
sdl_x = -1
sdl_y = -1

[smoothing]
monstercat = 1.5
noise_reduction = 77

[color]
# same palette as the default BitBeast cava config
background = '#0a0a0a'
foreground = '#F8A551'
gradient = 1
gradient_count = 8
gradient_color_1 = '#1F0606'
gradient_color_2 = '#5E0D0B'
gradient_color_3 = '#9D1911'
gradient_color_4 = '#74463A'
gradient_color_5 = '#E14D29'
gradient_color_6 = '#F96A8C'
gradient_color_7 = '#F8A551'
gradient_color_8 = '#FBDEAF'
